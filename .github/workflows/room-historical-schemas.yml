name: Historical Room schema export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-historical-schema:
    name: Export Room v${{ matrix.version }} schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1
            ref: 669b4271e5636e14f22d0332a966243d50d5f53f
          - version: 2
            ref: d7e59df0a3c600e5fb8550ddc795dd1f77ac7fde
          - version: 3
            ref: b1ba56e4743fd8034973061743ab1c776dad4e27
          - version: 4
            ref: 74cc368f474c34b2a9aac5145b79feb046c11506
          - version: 5
            ref: f39b23dd6dc182ecf4ab6359446406b5ba773465
          - version: 6
            ref: 814bf4434362fd82536fd6b625ce75cee4411552
          - version: 7
            ref: 64ff34e4612aaf17a1874ad7a4619966e51cb329
    steps:
      - name: Checkout historical source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable schema export without changing the historical commit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build_file = Path("core/storage/build.gradle.kts")
          build = build_file.read_text()
          marker = '    alias(libs.plugins.ksp)\n}\n'
          if build.count(marker) != 1:
              raise SystemExit("Expected one KSP plugin block in historical storage build")
          build = build.replace(
              marker,
              marker + 'ksp {\n    arg("room.schemaLocation", "$projectDir/schemas")\n}\n',
          )
          build_file.write_text(build)

          database_file = Path(
              "core/storage/src/main/java/com/familymesh/core/storage/family/FamilyMeshDatabase.kt"
          )
          database = database_file.read_text()
          if database.count("exportSchema = false") != 1:
              raise SystemExit("Expected exactly one disabled Room schema export setting")
          database_file.write_text(database.replace("exportSchema = false", "exportSchema = true"))
          PY
      - name: Generate historical Room schema
        run: gradle :core:storage:kspDebugKotlin --rerun-tasks
      - name: Upload historical schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v${{ matrix.version }}
          path: core/storage/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30
