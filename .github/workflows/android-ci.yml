name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Generate Room schema snapshot
        run: gradle :core:storage:kspDebugKotlin --rerun-tasks
      - name: Upload Room schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-snapshot
          path: core/storage/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: familymesh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  storage-instrumentation:
    # Cache AVD definition and system image to reduce repeated cold boots.
    # Snapshots are disabled because TCG Quick Boot has been unreliable on hosted runners.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore API 34 AVD and system-image cache
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            /usr/local/lib/android/sdk/system-images/android-34/default/x86_64
          key: familymesh-avd-api34-${{ runner.os }}-${{ runner.arch }}-default-x86_64-pixel2-v1
      - name: Run Room storage tests on emulator
        id: run-api34-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none
          disable-animations: true
          emulator-boot-timeout: 1200
          pre-emulator-launch-script: adb start-server
          script: gradle :core:storage:connectedDebugAndroidTest
      - name: Save API 34 AVD and system-image cache
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.run-api34-tests.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            /usr/local/lib/android/sdk/system-images/android-34/default/x86_64
          key: familymesh-avd-api34-${{ runner.os }}-${{ runner.arch }}-default-x86_64-pixel2-v1
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-instrumentation-reports
          path: |
            core/storage/build/reports/androidTests/connected/**
            core/storage/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 7
