name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Generate Room schema snapshot
        run: gradle :core:storage:kspDebugKotlin --rerun-tasks
      - name: Upload Room schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-snapshot
          path: core/storage/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: familymesh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  storage-instrumentation:
    # Cache AVD definition and system image to reduce repeated cold boots.
    # Use API 31 (project minSdk) and default target for faster, more reliable boots.
    # Snapshots are disabled because TCG Quick Boot has been unreliable on hosted runners.
    # Memory and core limits plus GPU mode chosen to reduce flaky system crashes during instrumentation.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore API 31 AVD and system-image cache
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            /usr/local/lib/android/sdk/system-images/android-31/default/x86_64
          key: familymesh-avd-api31-${{ runner.os }}-${{ runner.arch }}-default-x86_64-pixel2-v2
      - name: Run Room storage tests on emulator
        id: run-api31-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none -memory 2048 -cores 2 -skin 1080x1920
          disable-animations: true
          emulator-boot-timeout: 1200
          pre-emulator-launch-script: adb start-server
          script: |
            set +e; gradle :core:storage:connectedDebugAndroidTest; exit_code=$?; if [ $exit_code -ne 0 ]; then echo "First attempt failed with $exit_code; retrying once..."; sleep 10; gradle :core:storage:connectedDebugAndroidTest; exit_code=$?; fi; exit $exit_code
      - name: Save API 31 AVD and system-image cache
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.run-api31-tests.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            /usr/local/lib/android/sdk/system-images/android-31/default/x86_64
          key: familymesh-avd-api31-${{ runner.os }}-${{ runner.arch }}-default-x86_64-pixel2-v2
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-instrumentation-reports
          path: |
            core/storage/build/reports/androidTests/connected/**
            core/storage/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 7
