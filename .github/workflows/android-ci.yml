name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify draft COSE v2 primitive known-answer vector
        run: python3 tools/verify_cose_v2_kat.py
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Generate Room schema snapshot
        run: ./gradlew :core:storage:kspDebugKotlin --rerun-tasks
      - name: Upload Room schema snapshot
        uses: actions/upload-artifact@v6
        with:
          name: room-schema-snapshot
          path: core/storage/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: familymesh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  storage-instrumentation:
    # TCG Quick Boot snapshots failed to restore reliably (Error -22) on the
    # hosted Linux emulator. Cache the AVD definition and AOSP system image,
    # then boot once per job with snapshots disabled.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Restore API 34 AVD and system-image cache
        uses: actions/cache/restore@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            /usr/local/lib/android/sdk/system-images/android-34/default/x86_64
          key: familymesh-avd-api34-${{ runner.os }}-${{ runner.arch }}-default-x86_64-pixel2-v2
      - name: Run Room and Keystore tests on API 34 emulator
        id: run-api34-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none
          disable-animations: true
          emulator-boot-timeout: 1200
          pre-emulator-launch-script: adb start-server
          script: ./gradlew :core:storage:connectedDebugAndroidTest :core:identity:connectedDebugAndroidTest
      - name: Save API 34 AVD and system-image cache
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.run-api34-tests.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/avd/*
            /usr/local/lib/android/sdk/system-images/android-34/default/x86_64
          key: familymesh-avd-api34-${{ runner.os }}-${{ runner.arch }}-default-x86_64-pixel2-v2
      - name: Upload API 34 instrumentation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-api34-instrumentation-reports
          path: |
            core/storage/build/reports/androidTests/connected/**
            core/storage/build/outputs/androidTest-results/connected/**
            core/identity/build/reports/androidTests/connected/**
            core/identity/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 7

  identity-api31-instrumentation:
    # Match API 34's AOSP image, single-boot, AVD/system-image cache strategy.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Restore API 31 AVD and system-image cache
        uses: actions/cache/restore@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            /usr/local/lib/android/sdk/system-images/android-31/default/x86_64
          key: familymesh-avd-api31-${{ runner.os }}-${{ runner.arch }}-default-x86_64-pixel2-v2
      - name: Run Keystore tests on minimum supported API 31
        id: run-api31-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none
          disable-animations: true
          emulator-boot-timeout: 1200
          pre-emulator-launch-script: adb start-server
          script: ./gradlew :core:identity:connectedDebugAndroidTest
      - name: Save API 31 AVD and system-image cache
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.run-api31-tests.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/avd/*
            /usr/local/lib/android/sdk/system-images/android-31/default/x86_64
          key: familymesh-avd-api31-${{ runner.os }}-${{ runner.arch }}-default-x86_64-pixel2-v2
      - name: Upload API 31 identity instrumentation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: identity-api31-instrumentation-reports
          path: |
            core/identity/build/reports/androidTests/connected/**
            core/identity/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 7
